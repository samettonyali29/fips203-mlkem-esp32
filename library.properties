sentence=ML-KEM (FIPS 203) post-quantum key encapsulation for ESP32. Supports all three security levels: ML-KEM-512, ML-KEM-768 and ML-KEM-1024.
paragraph=Post-quantum key encapsulation mechanism based on the FIPS 203 standard (formerly CRYSTALS-Kyber). Ported from the mlkem-native reference implementation (PQCP) with ESP32 hardware RNG support, a stack-lean configuration and optional heap allocation. Provides key generation, encapsulation, decapsulation and FIPS 203 key validation for all three NIST security levels, plus NVS key storage.
